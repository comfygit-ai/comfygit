name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-install:
    name: Clean wheel install (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: macos-latest, python: '3.12'}
          - {os: windows-latest, python: '3.12'}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --frozen python dev/scripts/check-package-install.py --python ${{ matrix.python }}

  python:
    name: Core and CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install workspace
        run: uv sync --all-packages

      - name: Check versions and lockfile
        run: |
          make check-versions
          uv lock --check

      - name: Lint packages
        run: make lint

      - name: Test core, Studio runtime, and CLI
        run: uv run pytest packages/core/tests packages/studio-runtime/tests packages/cli/tests -q

  studio:
    name: Studio build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/studio/package-lock.json

      - name: Install Studio dependencies
        run: npm --prefix packages/studio ci

      - name: Audit Studio dependencies
        run: npm --prefix packages/studio audit --audit-level=high

      - name: Build and verify bundled Studio assets
        run: |
          npm --prefix packages/studio run build
          python3 dev/scripts/sync-studio-static.py
          git diff --exit-code -- packages/studio-runtime/comfygit_studio/static

      - name: Build Python release artifacts
        run: |
          uv build --package comfygit-core --no-sources
          uv build --package comfygit-studio --no-sources
          uv build --package comfygit --no-sources

  docs:
    name: Documentation build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs/comfygit-docs
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
          python-version: "3.12"
      - name: Check documentation lockfile
        run: uv lock --check
      - name: Build documentation with strict link validation
        run: uv run --frozen mkdocs build --strict
      - name: Audit locked documentation dependencies
        run: |
          uv export --frozen --no-dev --no-hashes --no-annotate --no-emit-project --output-file "$RUNNER_TEMP/docs-requirements.txt"
          uvx pip-audit==2.10.1 --disable-pip --no-deps --requirement "$RUNNER_TEMP/docs-requirements.txt"
