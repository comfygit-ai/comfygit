name: Publish Documentation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-documentation
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
          python-version: "3.12"

      - name: Build locked documentation
        working-directory: docs/comfygit-docs
        run: uv run --frozen mkdocs build --strict --site-dir ../../build-output

      - name: Publish to the Pages repository
        env:
          DOCS_PUBLISH_TOKEN: ${{ secrets.DOCS_PUBLISH_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        shell: bash
        run: |
          set -euo pipefail
          : "${DOCS_PUBLISH_TOKEN:?DOCS_PUBLISH_TOKEN is required}"
          # The helper contains no credential value. Git reads it from this step's
          # environment, never from a saved remote URL or a command argument.
          export GIT_ASKPASS="$RUNNER_TEMP/docs-git-askpass"
          trap 'rm -f "$GIT_ASKPASS"' EXIT
          cat > "$GIT_ASKPASS" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$DOCS_PUBLISH_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$GIT_ASKPASS"
          git -c credential.helper= clone --depth 1 \
            https://github.com/comfygit-ai/comfygit.github.io.git pages-repo
          rsync -a --delete --exclude='/.git/' --exclude='/CNAME' --exclude='/README.md' \
            build-output/ pages-repo/
          cd pages-repo
          if [ ! -f CNAME ]; then
            printf '%s\n' 'docs.comfygit.org' > CNAME
          fi
          touch .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          if git diff --staged --quiet; then
            echo 'No documentation changes to publish.'
          else
            git commit -m "Deploy ComfyGit docs from $SOURCE_SHA"
            git -c credential.helper= push
          fi

      - name: Deployment summary
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          {
            echo 'Documentation committed to comfygit-ai/comfygit.github.io.'
            echo "Source commit: $SOURCE_SHA"
            echo 'After Pages finishes, verify https://docs.comfygit.org/getting-started/overview/.'
          } >> "$GITHUB_STEP_SUMMARY"
